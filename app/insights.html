<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assembly Insights</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Assembly Insights: the manager view of the wire line (Savannah's Nov 13 design and field guide).
   Colors have one job each: mint clear/closed, amber Needs Review, orange Action Required, coral past 10% slower,
   white primary, gray structure. The heatmap uses a blue scale so amber stays "Needs Review" (audit, MED). */
:root {
  --bg: #121315; --panel: #1c1e21; --panel2: #24272b; --panel3: #2c3035; --line: #34383d; --line2: #464b52;
  --text: #ecebe7; --muted: #a3a6ab; --dim: #74787e;
  --mint: #8fd6b8; --amber: #f0c25a; --orange: #f08c4a; --coral: #f2917f; --gray: #8a8e94;
  --blue1: #22303f; --blue2: #2c4a66; --blue3: #3b6a94; --blue4: #5b93c7;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 26px 18px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; height: 100vh; }
.brand small { display: block; font: 500 12px/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brand b { display: block; font-size: 19px; font-weight: 500; margin: 6px 0 22px; }
nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 16px; border-left: 3px solid transparent; }
nav a.on { background: var(--panel3); border-left-color: #b9e57a; }
nav a:hover:not(.on) { background: var(--panel); }
nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.navsep { flex: 1; }
.src { border-top: 1px solid var(--line); padding-top: 16px; }
.src h4 { margin: 0 0 8px; font: 500 12px var(--sans); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { flex: 1; background: none; border: 0; padding: 8px 6px; border-radius: 6px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--panel3); color: var(--text); }
.src p { color: var(--muted); font-size: 13px; margin: 10px 0 6px; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--text); font-size: 13px; }
main { padding: 26px 34px 60px; max-width: 1500px; width: 100%; }
.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { margin: 0; font-size: 30px; font-weight: 500; }
.top .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.top .grow { flex: 1; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 34px 10px 14px; font: 15px var(--sans); appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); display: inline-block; }
.banner { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 0; padding: 12px 16px; margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.banner b { color: var(--text); font-weight: 500; }
.headline { font-size: 22px; margin: 0 0 18px; font-weight: 400; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-height: 112px; }
.kpi h5 { margin: 0 0 6px; font: 500 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kpi .big { font: 500 32px/1.15 var(--mono); }
.kpi .note { color: var(--muted); font-size: 13px; margin-top: 4px; }
.meta { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 18px; }
.card > h2, .card .h2 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
.cardhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.cardhead h2 { margin: 0; font-size: 20px; font-weight: 500; flex: 1; }
.cardhead span { color: var(--muted); font-size: 14px; }
.flow { display: flex; align-items: stretch; gap: 8px; }
.flow .arr { display: flex; align-items: center; color: var(--muted); font-size: 18px; }
.st { flex: 1 1 0; max-width: 420px; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-top: 4px solid var(--mint); border-radius: 10px; padding: 14px 18px 16px; text-align: left; }
.st.review { border-top-color: var(--amber); } .st.action { border-top-color: var(--orange); } .st.idle { border-top-color: var(--line2); }
.st.sel { outline: 1.5px solid var(--text); outline-offset: -1px; }
.st .id { font: 400 15px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); display: inline-block; flex: none; }
.dot.review { background: var(--amber); } .dot.action { background: var(--orange); } .dot.idle { background: var(--line2); }
.st .nm { font-size: 19px; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .num { font: 400 34px/1.2 var(--mono); margin-bottom: 4px; }
.st .ln { font-size: 14px; color: var(--muted); }
.c-amber { color: var(--amber) !important; } .c-orange { color: var(--orange) !important; } .c-coral { color: var(--coral) !important; } .c-mint { color: var(--mint) !important; }
.b { font-weight: 600; }
.panel { margin-top: 18px; border: 1px solid var(--line2); border-radius: 12px; padding: 20px 22px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 28px; }
.panel .crumb { font: 400 15px var(--mono); color: var(--muted); }
.panel .crumb2 { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.kicker { font: 500 13px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
.otitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.otitle h3 { margin: 0; font-size: 26px; font-weight: 500; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 14px; font-weight: 500; }
.pill.needs_review { background: var(--amber); color: #3a2a05; } .pill.action_required { background: var(--orange); color: #3b1c06; }
.pill.resolved, .pill.closed { background: var(--mint); color: #0e3427; } .pill.dismissed { background: var(--gray); color: #1b1d20; }
.obsmeta { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
.evid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.evbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-height: 150px; }
.evbox h6 { margin: 0 0 10px; font: 500 13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.evbox ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.evbox li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; font-size: 14px; }
.evbox li span:first-child { font-family: var(--mono); color: var(--muted); }
.evbox li.moved { border: 1.5px dashed var(--text); }
.evbox li.missing { color: var(--dim); }
.evbox .none { color: var(--muted); font-size: 14px; }
.photo { margin-top: 12px; }
.photo img { width: 100%; max-height: 300px; object-fit: contain; background: #000; border-radius: 8px; border: 1px solid var(--line); display: block; }
.photo span { font-size: 13px; color: var(--muted); }
.msg { margin: 14px 0 4px; font-size: 16px; }
.small { color: var(--muted); font-size: 13px; }
details.hist { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
details.hist summary { cursor: pointer; font-weight: 500; }
details.hist ol { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 14px; color: var(--muted); }
details.hist li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 3px 0; }
.pager { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.pager button { background: none; border: 0; font-size: 16px; font-weight: 500; padding: 4px 0; }
.pager button:disabled { color: var(--dim); cursor: default; }
.pager span { font-family: var(--mono); color: var(--muted); }
.steps { display: flex; gap: 0; justify-content: space-between; margin: 6px 0 14px; font-size: 15px; }
.steps span { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.steps span::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--line2); }
.steps span.done { color: var(--mint); } .steps span.done::before { background: var(--mint); }
.steps span.cur { color: var(--text); } .steps span.cur::before { background: var(--text); }
.plan { display: flex; justify-content: space-between; color: var(--text); font-size: 15px; margin-bottom: 12px; }
.decide { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.decide h4 { margin: 0 0 14px; font-size: 19px; font-weight: 500; }
.opt { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 13px 16px; margin-bottom: 10px; }
.opt:hover { border-color: var(--text); }
.opt.sel { border-color: var(--text); background: var(--panel3); }
.opt b { display: block; font-size: 16px; font-weight: 500; }
.opt small { font-size: 14px; font-weight: 500; }
.btnrow { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.btn { border: 1.5px solid var(--text); background: none; border-radius: 8px; padding: 13px 10px; font-weight: 600; font-size: 15px; }
.btn.pri { background: var(--text); color: #121315; }
.btn:disabled { opacity: .4; cursor: default; }
.done { text-align: center; padding: 10px 0 4px; }
.done .tick { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #121315; }
.done h4 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.done p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.heat { display: grid; gap: 3px; font-size: 13px; }
.heat .hl { color: var(--muted); font-family: var(--mono); display: flex; align-items: center; }
.heat .hh { color: var(--muted); font-family: var(--mono); text-align: center; font-size: 12px; }
.heat .cell { height: 28px; border-radius: 3px; background: var(--panel2); position: relative; }
.heat .cell.mk::after { content: ''; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 9px 9px 0; border-color: transparent var(--amber) transparent transparent; }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 500 13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 18px; border-bottom: 1px solid var(--line); }
td { padding: 16px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--panel2); }
td.n { font-family: var(--mono); font-size: 18px; text-align: right; } th.n { text-align: right; }
.tblwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stname b { display: block; font: 500 17px var(--mono); } .stname span { color: var(--muted); font-size: 14px; }
.bars { display: grid; grid-template-columns: 190px 1fr 50px; gap: 10px 16px; align-items: center; }
.bars .lab small { display: block; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.bar { height: 22px; background: var(--panel2); border-radius: 4px; display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bars .v { font-family: var(--mono); text-align: right; }
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.spark { display: grid; grid-template-columns: 70px 1fr 80px; align-items: center; gap: 10px; margin-bottom: 4px; }
.spark .v { text-align: right; font-size: 16px; line-height: 1.2; }
.empty { color: var(--muted); padding: 18px 0; }
.foot { color: var(--muted); font-size: 14px; margin-top: 26px; }
.warnline { color: var(--amber); font-size: 14px; margin-top: 6px; }
.stepslow { font-family: var(--mono); }
.obslist button { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; }
.obslist button:hover { background: var(--panel2); }
#main { min-width: 0; }
.card .cardhead { flex-wrap: wrap; }
.ub-note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.ub-scroll { overflow-x: auto; max-width: 100%; }
.ub-scroll table { min-width: 640px; }
.ub-tr { cursor: pointer; } .ub-tr:hover td, .ub-tr:focus td { background: var(--panel2); } .ub-tr:focus { outline: 2px solid var(--mint); outline-offset: -2px; }
.ub-stage { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 13px; font-weight: 500; background: var(--panel3); }
.ub-stage.incomplete { background: var(--panel3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.ub-stage.needs_review { background: var(--amber); color: #3a2a05; } .ub-stage.done { background: var(--mint); color: #0e3427; }
.tl { min-width: 560px; }
.tl-ax { display: flex; margin-left: 74px; justify-content: space-between; color: var(--muted); font-size: 12px; font-family: var(--mono); margin-bottom: 6px; }
.tl-row { display: flex; align-items: center; height: 34px; cursor: pointer; border-radius: 6px; } .tl-row:hover, .tl-row:focus { background: var(--panel2); } .tl-row:focus { outline: 2px solid var(--mint); }
.tl-lab { width: 74px; flex: none; font: 500 14px var(--mono); }
.tl-trk { position: relative; flex: 1; height: 100%; border-left: 1px solid var(--line2); }
.tl-b { position: absolute; top: 9px; height: 16px; border-radius: 4px; min-width: 3px; }
.tl-b.s2 { background: var(--mint); } .tl-b.s3 { background: #8fb4d6; } .tl-b.open { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.28) 0 4px, transparent 4px 8px); }
.tl-w { position: absolute; top: 16px; height: 2px; background: var(--dim); }
.tl-m { position: absolute; top: 4px; width: 3px; height: 26px; margin-left: -1px; background: var(--coral); border-radius: 2px; }
.tl-open { position: absolute; top: 8px; font-size: 12px; color: var(--muted); }
.tl-key { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-top: 12px; } .tl-key i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ub-sel { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 12px; font: inherit; max-width: 100%; margin-bottom: 14px; }
@media (max-width: 1100px) { .app { grid-template-columns: minmax(0, 1fr); } aside { position: static; height: auto; } .kpis { grid-template-columns: repeat(2, 1fr); } .panel, .grid2, .grid3 { grid-template-columns: 1fr; } .flow { flex-direction: column; } .flow .arr { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><small>Molex Innovation Studio</small><b>Assembly Insights</b></div>
    <nav id="nav">
      <a href="#overview" data-v="overview"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Overview</a>
      <a href="#stations" data-v="stations"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="5" height="12" rx="1"/><rect x="9.5" y="6" width="5" height="12" rx="1"/><rect x="16" y="6" width="5" height="12" rx="1"/></svg>Stations</a>
      <a href="#units" data-v="units"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1"/><rect x="4" y="11" width="16" height="4" rx="1"/><rect x="4" y="17" width="16" height="3" rx="1"/></svg>Units</a>
      <a href="#trends" data-v="trends"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8"/><path d="M4 21h16"/></svg>Trends &amp; Insights</a>
      <a href="/line"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h3M18 12h3M12 3v3M12 18v3"/></svg>Live line</a>
    </nav>
    <div class="navsep"></div>
    <div class="src">
      <h4>Data source</h4>
      <div class="seg" id="srcSeg"><button data-s="camera">Camera Testing</button><button data-s="sim">Simulation</button></div>
      <p id="srcNote"></p>
      <button class="linkbtn" id="resetDemo" hidden>Reset demo decisions</button>
    </div>
  </aside>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<script src="/line-engine.js"></script>
<script src="/insights-lib.js"></script>
<script>
'use strict';
const L = window.InsightsLib;
const S = {
  src: lsGet('insights-src') || 'camera', period: null, view: 'overview', station: null, obsIdx: {}, sel: null, planPick: null, verifyAsk: null, flash: null,
  real: null, demo: null, demoReviews: null, model: null, loading: false, err: null
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage off */ } }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtT = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtD = t => new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
const sid = id => String(id).toUpperCase();
const pct = p => (p == null ? '–' : (p >= 0 ? p + '% slower' : -p + '% faster'));
const dur = m => (m == null ? '' : m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm');

// ---------- data ----------
async function loadReal() {
  try {
    const r = await fetch('/api/insights', { cache: 'no-store' });
    if (!r.ok) throw new Error('The server answered ' + r.status);
    S.real = await r.json(); S.err = null;
  } catch (e) { S.err = 'Could not read the recorded runs: ' + e.message + '. Is npm run go running?'; }
}
function ensureDemo() {
  if (S.demo) return;
  const cfg = (S.real && S.real.config) || { stations: [] };
  S.demo = L.makeDemo(cfg.stations.length >= 4 ? cfg : demoConfig(), Date.now());
  let saved = null; try { saved = JSON.parse(lsGet('insights-demo-reviews') || 'null'); } catch (e) { saved = null; }
  S.demoReviews = Object.assign({}, S.demo.reviews, saved || {});
}
function demoConfig() {
  const mk = (id, label, subs) => ({ id, label, substeps: subs.map((l, i) => ({ id: id + '_' + i, label: l })) });
  return { stations: [mk('s1', 'Cut', ['Cut the wire', 'Check length']), mk('s2', 'Arrange and clamp', ['Wires arrive', 'Open the lever connector', 'Arrange the wires', 'Close the levers']),
    mk('s3', 'Second connector', ['Unit arrives', 'Add a new lever connector', 'Get a black wire', 'Insert the black wire']), mk('s4', 'QA pull test', ['Unit arrives', 'Pull test'])] };
}
function periodRange() {
  const now = Date.now(), d = new Date(now); d.setHours(0, 0, 0, 0);
  if (S.period === 'today') return { from: d.getTime(), to: now, now };
  if (S.period === 'week') return { from: d.getTime() - 6 * 86400000, to: now, now };
  return { from: -Infinity, to: Infinity, now };
}
function compute() {
  const r = periodRange();
  if (S.src === 'sim') { ensureDemo(); S.model = L.rollup(S.demo.digests, S.demoReviews, Object.assign(r, { refSec: S.demo.refSec })); }
  else S.model = S.real ? L.rollup(S.real.digests, S.real.reviews, r) : null;
}
function defaultPeriod() {
  if (S.src === 'sim') return 'week';
  if (!S.real) return 'all';
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return S.real.digests.some(g => g.startedAtMs >= d.getTime()) ? 'today' : 'all';
}
async function saveDecision(obs, action) {

function heatmap() {

    if (now === lastSig) { const u = document.querySelector('.live'); if (u && S.real) u.innerHTML = '<i></i>Updated ' + fmtT(S.real.generatedAt); return; }
    lastSig = now; compute(); render();
  }, 5000);
  function sig() { return S.real ? JSON.stringify([S.real.digests.map(d => [d.id, d.observations.length, Object.values(d.stations).map(x => x.cycles.length)]), Object.keys(S.real.reviews).length, S.err]) : String(S.err); }
})();
</script>
