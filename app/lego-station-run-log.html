<title>LEGO Station Run Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: time-study ledger. Sticky bar, then one view at a time: runs ledger -> run sheet -> new-run bench (video left, element sheet right). */
:root {
  --bg: #eef0ee; --surface: #fcfcfb; --surface-2: #f3f4f2; --sunk: #e4e7e4;
  --ink: #15181b; --ink-2: #4a4f56; --muted: #767b83; --line: #dcdfdc; --line-2: #c5c9c5; --grid: #e6e8e5;
  --accent: #a3522a; --accent-2: #8a4321; --on-accent: #ffffff; --accent-wash: rgba(163, 82, 42, .08);
  --k-reach: #2a78d6; --k-position: #eb6834; --k-press: #1baf7a; --k-release: #eda100; --k-hold: #e87ba4; --k-idle: #c9ccc9; --k-other: #8d9197;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5200; --crit: #d03b3b; --crit-ink: #b02e2e;
  --tip-bg: #15181b; --tip-fg: #f3f4f2;
  --shadow: 0 1px 2px rgba(21, 24, 27, .06);
  --f-ui: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #181a1d; --surface-2: #1f2225; --sunk: #0c0d0f;
    --ink: #eff1ef; --ink-2: #bfc3c8; --muted: #8a8f96; --line: #2a2e33; --line-2: #3a3f45; --grid: #23272b;
    --accent: #dc8b55; --accent-2: #e9a273; --on-accent: #15181b; --accent-wash: rgba(220, 139, 85, .12);
    --k-reach: #3987e5; --k-position: #d95926; --k-press: #199e70; --k-release: #c98500; --k-hold: #d55181; --k-idle: #3a3f45; --k-other: #80858c;
    --good-ink: #3fbf3f; --warn-ink: #fab219; --crit-ink: #e66767;
    --tip-bg: #eff1ef; --tip-fg: #15181b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #181a1d; --surface-2: #1f2225; --sunk: #0c0d0f;
  --ink: #eff1ef; --ink-2: #bfc3c8; --muted: #8a8f96; --line: #2a2e33; --line-2: #3a3f45; --grid: #23272b;
  --accent: #dc8b55; --accent-2: #e9a273; --on-accent: #15181b; --accent-wash: rgba(220, 139, 85, .12);
  --k-reach: #3987e5; --k-position: #d95926; --k-press: #199e70; --k-release: #c98500; --k-hold: #d55181; --k-idle: #3a3f45; --k-other: #80858c;
  --good-ink: #3fbf3f; --warn-ink: #fab219; --crit-ink: #e66767;
  --tip-bg: #eff1ef; --tip-fg: #15181b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* Bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand svg { width: 34px; height: 22px; flex: none; }
.brand-name { font-weight: 700; font-size: 17px; letter-spacing: .01em; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); line-height: 1.2; }
.bar-nav { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ro { font-size: 12px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; line-height: 1.3; }
.btn:hover { border-color: var(--ink-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn svg { width: 14px; height: 14px; }

/* Page */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 56px; display: grid; gap: 28px; }
.head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.head h1 { font-size: 28px; line-height: 1.15; }
.head .sub { color: var(--ink-2); max-width: 68ch; margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 18px; }
.sec-h .note { font-size: 13px; color: var(--muted); }
.back { font-size: 14px; color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.stat .v { font-family: var(--f-mono); font-size: 26px; font-weight: 500; line-height: 1.2; letter-spacing: -.01em; }
.stat .v small { font-size: 14px; color: var(--ink-2); font-weight: 400; }
.stat .s { font-size: 13px; color: var(--ink-2); }

/* Pills and chips */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line-2); white-space: nowrap; color: var(--ink-2); }
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.pill.warn { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.pill.na { color: var(--ink-2); }
.pill.busy { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-wash); }
.pill.busy i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
.pill.bad { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 7%, transparent); }
@media (prefers-reduced-motion: reduce) { .pill.busy i { animation: none; } }
.ccmsg { font-family: var(--f-mono); font-size: 12.5px; padding: 10px 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; user-select: all; }
.state h2 { font-size: 20px; }
.cmp-pick { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.cmp-pick select { width: auto; min-width: 190px; }
.verdict { display: flex; gap: 12px; align-items: flex-start; }
.verdict .pill { flex: none; margin-top: 3px; }
.verdict p { margin-top: 2px; max-width: 72ch; }
.diffs { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink); }
.cmp-line { font-size: 14px; color: var(--ink-2); }
.cmp-line b { color: var(--ink); font-weight: 600; }
.tl-row.static { cursor: default; }
.tl-row.static:hover { background: transparent; }
.cmp-tl { border: 1px solid var(--line); border-radius: 6px; }
.fs-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 16px; }
.fs-pair figure { margin: 0; display: grid; gap: 6px; align-content: start; }
.fs-pair figcaption { font-size: 12.5px; color: var(--muted); }
.fs-pair img { display: block; width: 100%; border-radius: 6px; background: var(--sunk); }
.fs-pair .no { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 12px; }
.big { font-weight: 600; color: var(--ink); }
.state p { color: var(--ink-2); max-width: 62ch; }
.state a { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 4px; padding: 0 6px; vertical-align: 2px; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.chip.f-unclear { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.chip.f-deviation { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 8%, transparent); }
/* Procedure check */
.proc-banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); }
.proc-banner svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.proc-banner b { display: block; font-size: 17px; }
.proc-banner p { color: var(--ink-2); font-size: 14px; }
.proc-banner.bad { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 7%, transparent); }
.proc-banner.ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 7%, transparent); }
.proc-banner.unsure { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.proc-list { list-style: none; margin: 0; padding: 0; display: grid; }
.proc-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.proc-list li:last-child { border-bottom: 0; }
.proc-list .pn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
.proc-list .pd { grid-column: 2 / -1; font-size: 13.5px; color: var(--ink-2); }
.proc-list li.bad .pt { color: var(--crit-ink); font-weight: 600; }
.chip.p-ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.chip.p-bad { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 8%, transparent); }
.chip.p-unclear { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }

/* Kind swatches */
.k-reach { --c: var(--k-reach); } .k-position { --c: var(--k-position); } .k-press { --c: var(--k-press); }
.k-release { --c: var(--k-release); } .k-hold { --c: var(--k-hold); } .k-idle { --c: var(--k-idle); } .k-other { --c: var(--k-other); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--c); flex: none; }
.sw.idle, .seg.idle { background: repeating-linear-gradient(135deg, var(--k-idle) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Timelines */
.tl { display: grid; }
.tl-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 92px; gap: 14px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tl-row:last-child { border-bottom: 0; }
.tl-row:hover { background: var(--accent-wash); }
.tl-row.is-base { background: var(--surface-2); }
.tl-row.is-base:hover { background: var(--accent-wash); }
.tl-row .lab { min-width: 0; line-height: 1.25; }
.tl-row .lab b { font-weight: 600; }
.tl-row .lab div { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row .val { text-align: right; line-height: 1.25; }
.tl-row .val div:first-child { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.tl-row .val div + div { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tl-axis-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 92px; gap: 14px; padding: 8px 12px 0; }
.track { position: relative; height: 20px; }
.track.lanes-2 { height: 30px; }
.track.tall { height: 30px; }
.track.tall.lanes-2 { height: 42px; }
.tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--grid); }
.seg { position: absolute; top: 0; height: 20px; border-radius: 3px; background: var(--c); min-width: 2px; }
.track.tall .seg { height: 28px; }
.seg.l1 { top: 23px; height: 7px; border-radius: 2px; }
.track.tall .seg.l1 { top: 32px; height: 10px; }
.seg:hover { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
.track.seekable { cursor: pointer; }
.mark { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: var(--accent); z-index: 3; pointer-events: none; }
.mark::before { content: attr(data-label); position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font: 600 10px/1 var(--f-mono); color: var(--accent); white-space: nowrap; letter-spacing: .04em; }
.playhead { position: absolute; top: -10px; bottom: -10px; width: 2px; margin-left: -1px; background: var(--ink); z-index: 4; pointer-events: none; left: 0; }
.axis { position: relative; height: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.strip-box { padding: 26px 4px 4px; display: grid; gap: 6px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl th.num { text-align: right; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: var(--accent-wash); }
.tbl tr.now td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tbl .el-name { display: flex; gap: 8px; align-items: baseline; min-width: 150px; }
.tbl .el-name .sw { transform: translateY(1px); }
.tbl .obs { color: var(--ink-2); min-width: 200px; }
.tbl .flagtxt { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; min-width: 140px; }
.code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rbar { position: relative; height: 14px; min-width: 140px; }
.rbar .rail { position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--grid); }
.rbar .rng { position: absolute; top: 5px; height: 4px; border-radius: 2px; background: var(--ink-2); }
.rbar .mean { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.rbar .base { position: absolute; top: 0; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }

/* Run sheet */
.detail { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
.player { display: grid; gap: 10px; }
.player video { width: 100%; max-height: 66vh; background: var(--sunk); border-radius: 8px; display: block; }
.vid-missing { aspect-ratio: 9 / 16; max-height: 66vh; background: var(--sunk); border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
.tnow { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.meta-list { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.meta-list dt { color: var(--muted); }
.meta-list dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.compare { display: grid; gap: 8px; font-size: 14px; }
.compare li { color: var(--ink-2); }
.compare ul, .lists ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.lists li { color: var(--ink-2); font-size: 14px; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; }
.frame { display: grid; gap: 6px; align-content: start; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.frame .img { position: relative; aspect-ratio: var(--ar, 9 / 16); width: 100%; border-radius: 6px; overflow: hidden; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .img .no { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--muted); padding: 10px; text-align: center; }
.frame .cap { font-size: 13px; line-height: 1.3; }
.frame .cap b { font-weight: 600; }
.frame .cap .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.frame:hover .img { box-shadow: inset 0 0 0 2px var(--accent); }
.final { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.final .shot { flex: 0 1 200px; min-width: 150px; border-radius: 6px; overflow: hidden; background: var(--sunk); }
.final .compare { flex: 1 1 280px; min-width: 0; }
.final .shot img { display: block; width: 100%; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--crit) 45%, transparent); border-radius: 6px; background: color-mix(in srgb, var(--crit) 6%, transparent); font-size: 14px; }

/* Bench */
.drop { display: grid; place-items: center; gap: 10px; text-align: center; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 44px 20px; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-wash); }
.drop b { font-size: 17px; }
.drop svg { width: 40px; height: 40px; color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: how; }
.how div { padding: 14px 16px; font-size: 14px; color: var(--ink-2); }
.how div b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
.how div::before { counter-increment: how; content: counter(how); font-family: var(--f-mono); font-size: 12px; color: var(--accent); display: block; margin-bottom: 4px; }
.loaded { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 22px; align-items: start; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.in { font-size: 14px; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
textarea.in { resize: vertical; min-height: 38px; line-height: 1.4; }

    <button class="brand" type="button" data-go="runs" aria-label="All runs">
      <svg viewBox="0 0 34 22" aria-hidden="true"><rect x="0.5" y="0.5" width="33" height="21" rx="3" fill="var(--accent)"/><g fill="none" stroke="var(--on-accent)" stroke-width="1.4"><circle cx="6.5" cy="6.5" r="3"/><circle cx="13.5" cy="6.5" r="3"/><circle cx="20.5" cy="6.5" r="3"/><circle cx="27.5" cy="6.5" r="3"/><circle cx="6.5" cy="15.5" r="3"/><circle cx="13.5" cy="15.5" r="3"/><circle cx="20.5" cy="15.5" r="3"/><circle cx="27.5" cy="15.5" r="3"/></g></svg>
      <span><span class="brand-name">LEGO Station Run Log</span><br><span class="brand-sub">One station · cycle time study from video</span></span>
    </button>

  </div>

<main id="view" class="wrap" aria-live="polite">
  <div class="panel empty"><div class="skel" style="width:220px"></div><div class="skel" style="width:320px"></div></div>
</main>
<footer class="foot">
  <p>Station-level process data only. A run describes the work at the station, not the person doing it: no names, faces or operator scores are stored.</p>
  <p>Times are read from video frames and are approximate to about ±0.1 s.</p>
</footer>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  'use strict';
  // Set by app/local-runtime.js when server.mjs serves the page; absent on claude.ai.
  const LOCAL = !!window.RUNLOG_LOCAL;

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = n => Math.round(n * 100) / 100;
  const fin = n => typeof n === 'number' && Number.isFinite(n);
  const fmtS = (n, d = 2) => fin(n) ? n.toFixed(d) + ' s' : '—';
  const fmtT = n => fin(n) ? n.toFixed(2) : '—';
  const fmtD = n => {
    if (!fin(n)) return '—';
    if (Math.abs(n) < 0.005) return '±0.00 s';
    return (n > 0 ? '+' : '−') + Math.abs(n).toFixed(2) + ' s';
  };
  const fmtPct = n => {
    if (!fin(n)) return '';
    if (Math.abs(n) < 0.005) return '0%';
    return (n > 0 ? '+' : '−') + Math.abs(n * 100).toFixed(0) + '%';
  };
  const uid = () => Math.random().toString(36).slice(2, 9);
  const blob = id => id ? '/_blob/' + id : '';
  const fmtDate = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const clone = o => JSON.parse(JSON.stringify(o == null ? null : o));
  const MAX_ASSET = (LOCAL ? 500 : 20) * 1024 * 1024;

  const KINDS = {
    reach: 'Reach & grasp', position: 'Move & position', press: 'Press & seat',
    release: 'Release & set down', hold: 'Hold (parallel)', idle: 'Idle / pause', other: 'Other'
  };
  const LEGEND_KINDS = ['reach', 'position', 'press', 'release', 'hold', 'idle'];
  const FLAGS = { none: 'No flag', note: 'Note', unclear: 'Unclear', deviation: 'Possible deviation' };
  const STATUS = {
    NORMAL: { label: 'Normal', cls: 'ok' },
    POSSIBLE_DEVIATION: { label: 'Possible deviation', cls: 'warn' },
    INSUFFICIENT_INFORMATION: { label: 'Insufficient info', cls: 'na' }
  };
  const MATCH = { yes: 'Matches baseline', no: 'Differs from baseline', unclear: 'Unclear' };
  const ICON = {
    ok: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.6 6.2l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.3l5 9.1H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 4.8v2.4M6 8.8v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    na: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.7 4.7a1.4 1.4 0 1 1 1.9 1.3c-.4.2-.6.5-.6.9M6 8.8v.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    set: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v3M7 10v3M1 7h3M10 7h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="7" r="2" fill="currentColor"/></svg>',
    x: '<svg viewBox="0 0 14 14" aria-hidden="true" width="14" height="14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    plus: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    film: '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="9" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17 15v10l8-5z" fill="currentColor"/></svg>'
  };
  const DEFAULT_CATALOG = [
    { key: 'idle_pre', label: 'Idle before cycle', kind: 'idle' },
    { key: 'pick_pink', label: 'Reach and grasp pink 1×6 brick', kind: 'reach' },
    { key: 'hold_plate', label: 'Hold the base plate', kind: 'hold' },
    { key: 'place_pink', label: 'Place pink brick on plate', kind: 'position' },
    { key: 'seat_pink', label: 'Press pink brick down', kind: 'press' },
    { key: 'pick_blue', label: 'Reach and grasp blue 2×2 slope', kind: 'reach' },
    { key: 'carry_blue', label: 'Carry blue slope', kind: 'position' },
    { key: 'orient_blue', label: 'Position and orient blue slope', kind: 'position' },
    { key: 'seat_blue', label: 'Press blue slope down', kind: 'press' },
    { key: 'release', label: 'Release and set down', kind: 'release' },
    { key: 'idle_post', label: 'Idle after cycle', kind: 'idle' }
  ];
  const IDLE_EDGE = ['idle_pre', 'idle_post'];

  // ---------- state ----------
  const S = {
    db: null, assets: null, sample: undefined, isOwner: null, sampleLimits: null, sampleOff: false, downloads: null, user: null,
    diag: { csp: [], lastError: '', limitsErr: '' },
    mcp: undefined, ccErr: {}, ccErrMsg: {}, ccSession: {}, localRef: {},
    canWrite: null, readOnly: false, dbUnavailable: false, dbError: null,
    runs: [], runsLoaded: false, settings: {}, settingsRaw: null,
    route: parseHash(), draft: null, confirmDelete: false, renderedKey: null, playerCleanup: null, leaveTo: null
  };

  // ---------- derived ----------
  const dur = e => Math.max(0, (e.end || 0) - (e.start || 0));
  const cycleTime = run => run && run.cycle && fin(run.cycle.end) && fin(run.cycle.start) ? r2(run.cycle.end - run.cycle.start) : null;
  const byStart = (a, b) => (a.start - b.start) || (a.end - b.end);
  const elementsOf = run => (run && Array.isArray(run.elements) ? run.elements : []).slice().sort(byStart);
  const workEls = run => elementsOf(run).filter(e => e.kind !== 'idle');
  const flagCount = run => elementsOf(run).filter(e => e.flagType && e.flagType !== 'none').length;
  const hasEls = r => !!(r && Array.isArray(r.elements) && r.elements.length);
  const isPending = r => !!(r && r.analysis && r.analysis.state && r.analysis.state !== 'done' && !hasEls(r));
  const isRechecking = r => !!(r && r.analysis && (r.analysis.state === 'queued' || r.analysis.state === 'running') && hasEls(r));
  const doneRuns = () => S.runs.filter(r => !isPending(r));
  const findDone = id => id ? doneRuns().find(r => r.id === id) || null : null;
  function baseline() {
    const runs = doneRuns();
    if (!runs.length) return null;
    return runs.find(r => r.id === S.settings.baselineRunId) || runs[0];
  }
  // The run this one is compared with: a viewer's local pick, the run's saved pick, else the baseline.
  function refFor(run) {
    const pick = findDone(S.localRef[run.id]) || findDone(run.compareToRunId);
    if (pick && pick.id !== run.id) return pick;
    const b = baseline();
    return b && b.id !== run.id ? b : null;
  }
  function refOptions(run, selId) {
    const base = baseline();
    return doneRuns().filter(r => !run || r.id !== run.id).map(r => '<option value="' + esc(r.id) + '"' + (r.id === selId ? ' selected' : '') + '>' + esc(runName(r) + (base && r.id === base.id ? ' · Baseline' : (r.label ? ' · ' + r.label : ''))) + '</option>').join('');
  }
  async function saveSettings(patch) {
    const ref = S.db.doc('meta/settings');
    if (S.settingsRaw) await ref.update(patch);
    else await ref.set(Object.assign({}, S.settings, patch));
  }
  const fmtClock = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
  const minutesSince = iso => { const t = Date.parse(iso); return isNaN(t) ? null : (Date.now() - t) / 60000; };
  const CC_SERVER = 'Claude Code Remote';
  const ARTIFACT_URL = 'https://claude.ai/artifact/DesRvsYhrX3J6W5b1b1vwD';
  function catalog() {
    const base = baseline();
    const out = [];
    const seen = new Set();
    for (const e of elementsOf(base)) {
      if (!e.key || e.key === 'other' || seen.has(e.key)) continue;
      seen.add(e.key);
      out.push({ key: e.key, label: e.label, kind: e.kind });
    }
    for (const c of DEFAULT_CATALOG) if (!seen.has(c.key)) { seen.add(c.key); out.push(c); }
    return out;
  }
  function durByKey(run) {
    const m = {};
    for (const e of elementsOf(run)) {
      if (!e.key || e.key === 'other') continue;
      m[e.key] = r2((m[e.key] || 0) + dur(e));
    }
    return m;
  }
  function pressShare(run) {
    const ct = cycleTime(run);
    if (!ct) return null;
    const p = workEls(run).filter(e => e.kind === 'press').reduce((s, e) => s + dur(e), 0);
    return p / ct;
  }
  function seqCheck(run, base) {
    const res = { same: true, missing: [], extra: [], repeats: [], swap: null };
    if (!run || !base) return res;
    const bEls = workEls(base);
    const rEls = workEls(run);
    const bk = bEls.map(e => e.key).filter(k => k && k !== 'other');
    const rk = rEls.map(e => e.key).filter(k => k && k !== 'other');
    const label = k => (bEls.find(e => e.key === k) || rEls.find(e => e.key === k) || {}).label || k;
    res.missing = [...new Set(bk.filter(k => !rk.includes(k)))].map(label);
    res.extra = rEls.filter(e => !e.key || e.key === 'other' || !bk.includes(e.key)).map(e => e.label || 'Unlabeled element');
    res.repeats = [...new Set(rk.filter((k, i) => rk.indexOf(k) !== i))].map(label);
    const ordered = els => [...new Set(els.filter(e => e.kind !== 'hold').map(e => e.key))];
    const rFirst = ordered(rEls).filter(k => bk.includes(k));
    const bFirst = ordered(bEls).filter(k => rk.includes(k));
    for (let i = 0; i < Math.min(rFirst.length, bFirst.length); i++) {
      if (rFirst[i] !== bFirst[i]) { res.swap = [label(rFirst[i]), label(bFirst[i])]; break; }
    }
    res.same = !res.missing.length && !res.extra.length && !res.repeats.length && !res.swap;
    return res;
  }
  function seqSummary(sc) {
    if (sc.same) return 'Same elements, same order as the baseline.';
    const parts = [];
    if (sc.missing.length) parts.push('Not seen: ' + sc.missing.join(', ') + '.');
    if (sc.extra.length) parts.push('Not in baseline: ' + sc.extra.join(', ') + '.');
    if (sc.repeats.length) parts.push('Repeated: ' + sc.repeats.join(', ') + '.');
    if (sc.swap) parts.push('Order differs: “' + sc.swap[0] + '” came where the baseline has “' + sc.swap[1] + '”.');
    return parts.join(' ');
  }

  // ---------- routing ----------
  function parseHash() {
    let h = '';
    try { h = (location.hash || '').slice(1); } catch (e) { h = ''; }
    if (!h || h === 'runs') return { view: 'runs' };
    if (h === 'new') return { view: 'new' };
    if (h === 'camera') return { view: 'camera' };
    if (h.indexOf('edit-') === 0) return { view: 'edit', id: h.slice(5) };
    return { view: 'run', id: h };
  }
  function hashFor(r) {
    if (r.view === 'runs') return '#runs';
    if (r.view === 'new') return '#new';
    if (r.view === 'camera') return '#camera';
    if (r.view === 'edit') return '#edit-' + r.id;
    return '#' + r.id;
  }
  function go(view, id, force) {
    const next = { view, id };
    if (!force && S.draft && S.draft.dirty && (S.route.view === 'new' || S.route.view === 'edit')) {
      S.leaveTo = next;
      renderLeaveConfirm();
      return;
    }
    if (S.route.view === 'new' || S.route.view === 'edit') dropDraft();
    S.route = next;
    S.confirmDelete = false;
    S.renderedKey = null;
    try { if (location.hash !== hashFor(next)) location.hash = hashFor(next); } catch (e) { /* no hash in this frame */ }
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }
  window.addEventListener('hashchange', () => {
    const r = parseHash();
    if (r.view === S.route.view && r.id === S.route.id) return;
    go(r.view, r.id);
  });
  function dropDraft() {
    const d = S.draft;
    if (d) {
      if (d.ctl) try { d.ctl.abort(); } catch (e) { /* ignore */ }
      d.cancelled = true;
      if (d.objectUrl) try { URL.revokeObjectURL(d.objectUrl); } catch (e) { /* ignore */ }
      if (d.videoAssetId && !d.saved && S.assets) S.assets.delete(d.videoAssetId).catch(() => {});
    }
    S.draft = null;
  }

  // ---------- capabilities ----------
  async function init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.dbUnavailable = true; render(); return; }
    c.use('db').then(db => {
      S.db = db;

  function subscribe() {

      }).sort((a, b) => (a.number || 0) - (b.number || 0) || String(a.createdAt).localeCompare(String(b.createdAt)));

      onData();

    if (code === 'quota_exceeded') return 'The run store is full. Delete runs you no longer need, then save again.';

  // timeline strip

    const ends = [];

  function tickStep(span) { return span <= 3 ? 0.5 : span <= 12 ? 1 : span <= 30 ? 2 : span <= 75 ? 5 : 10; }

  function stripHtml(els, o) {

    const step = tickStep(span);
    let ticks = '';

      return '<span class="seg k-' + esc(e.kind || 'other') + ' l' + lane + (e.kind === 'idle' ? ' idle' : '') + '" style="left:' + x.toFixed(3) + '%;width:calc(' + w.toFixed(3) + '% - 2px)" data-tip="' + esc(segTip(e, o.baseMap, t0, o.refLabel)) + '"' + (o.seekable ? ' data-seek="' + e.start + '"' : '') + '></span>';

  function axisHtml(span) {

  }
  function cycleEls(run) {

  async function fireAnalysis(runId, text) {

  async function ccAnalyze(btn) {
    const d = S.draft;
    if (!d || d.busy) return;
    if (!S.assets) { d.error = 'Sending a run to Claude Code needs Editor access, so the video can be stored for it.'; renderNew(); return; }
    if (!d.videoAssetId && d.fileSize > MAX_ASSET) { d.error = 'This video is over 20 MB, so it can’t be stored for Claude Code. Trim it to one cycle and try again.'; renderNew(); return; }
    if (d.shaReady) await d.shaReady;
    const same = d.sha256 && S.runs.find(r => r.video && r.video.sha256 === d.sha256);
    if (same) { d.error = 'This exact video is already ' + runName(same) + '. Record a new cycle, or open ' + runName(same) + '.'; renderNew(); return; }
    d.busy = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Storing the video…'; }
    const now = new Date().toISOString();
    let id = '';
    try {
      if (!d.videoAssetId) {
        const isMov = /quicktime/i.test(d.file.type) || /\.mov$/i.test(d.file.name);
        const res = await S.assets.upload(d.file, { type: isMov || !d.file.type ? 'video/mp4' : d.file.type });
        d.videoAssetId = res.id;
      }
      if (btn) btn.textContent = 'Queuing the run…';
      const number = nextNumber();
      id = 'run-' + String(number).padStart(3, '0') + '-' + uid().slice(0, 4);
      await S.db.collection('runs').doc(id).set({
        number, label: String(d.label || '').trim(), condition: String(d.condition || '').trim(), createdAt: now,
        video: Object.assign({ assetId: d.videoAssetId, fileName: d.fileName, durationS: d.meta.durationS, width: d.meta.width, height: d.meta.height }, d.sha256 ? { sha256: d.sha256 } : {}),
        status: 'INSUFFICIENT_INFORMATION', statusNote: '', elements: [], processData: [], limitations: [],
        source: { method: 'claude-code' }, analysis: { state: 'queued', mode: 'full', requestedAt: now },
        compareToRunId: d.compareTo || (baseline() || {}).id || ''
      });
    } catch (e) {
      d.busy = false;
      const code = e && e.code;
      d.error = id && ['invalid_argument', 'quota_exceeded', 'resource_exhausted', 'revoked'].includes(code) ? handleWriteError(e) : 'Couldn’t store the video for Claude Code (' + (code || 'error') + '). Try again, or time the run by hand.';
      renderNew();
      return;
    }
    d.saved = true; d.dirty = false;
    if (LOCAL) { toast('Run queued. Ask your agent to analyze it.'); go('run', id, true); return; }
    if (btn) btn.textContent = 'Starting Claude Code…';
    const ok = await fireAnalysis(id);
    toast(ok ? 'Sent to Claude Code' : 'Run queued. Start it from the run page.');
    go('run', id, true);
  }

  function bindRunPlayer(span) {

  function buildPrompt(dt, durS, sheets, base) {

    const doc = {
      number, label: String(d.label || '').trim(), condition: String(d.condition || '').trim(),
      createdAt: d.createdAt || new Date().toISOString(),
      video: videoInfo,
      cycle: { start: r2(d.cycle.start), end: r2(d.cycle.end) },
      status: check ? check.status : d.status,
      statusNote: (check && check.raised ? 'Standard check: ' + check.issues.join('; ') + '. ' : '') + String(d.statusNote || '').trim(),
      elements: d.elements.map(e => {
        const o = { key: e.key || 'other', label: String(e.label || '').trim(), kind: e.kind || 'other', start: r2(e.start), end: r2(e.end), observed: String(e.observed || '').trim(), flagType: e.flagType || 'none', flag: String(e.flag || '').trim() };
        if (e.method) o.method = e.method;
        if (e.frameAssetId) o.frameAssetId = e.frameAssetId;
        if (fin(e.frameT)) o.frameT = e.frameT;
        return o;
      }),
      finalState: Object.assign({}, { matchesBaseline: d.finalState.matchesBaseline || 'unclear', note: String(d.finalState.note || '').trim() },
        d.finalState.frameAssetId ? { frameAssetId: d.finalState.frameAssetId, frameT: d.finalState.frameT } : {},
        d.finalState.closeupAssetId ? { closeupAssetId: d.finalState.closeupAssetId } : {}),
      processData: String(d.processData || '').split('\n').map(s => s.trim()).filter(Boolean),
      limitations: String(d.limitations || '').split('\n').map(s => s.trim()).filter(Boolean),
      source: Object.assign({}, d.source || {}, isNew ? {} : { editedAt: new Date().toISOString() })
    };
    if (check) doc.check = { against: ref.id, status: check.status, issues: check.issues, timing: check.timing, checkedAt: new Date().toISOString() };
    const cmpTo = d.compareTo || (isNew ? (baseline() || {}).id : '');
    if (cmpTo) doc.compareToRunId = cmpTo;
    if (d.comparedToRunId) doc.comparedToRunId = d.comparedToRunId;
    if (Array.isArray(d.differences)) doc.differences = d.differences;
    say('Saving the run…');
    try {
      await S.db.collection('runs').doc(id).set(doc);
    } catch (e) {
      d.saving = false;
      if (btn) btn.disabled = false;
      say(handleWriteError(e), true);
      renderBar();
      return;
    }
    toast(isNew ? 'Run ' + number + ' saved' : 'Run ' + number + ' updated');
    d.dirty = false;
    d.saved = true;
    go('run', id, true);
  }

  // ---------- live camera test (standalone; touches no analysis code) ----------
  const CAM = { stream: null, busy: false, error: '', info: '', devices: [], deviceId: '' };
  function camEnv() {
    const lines = [];
    lines.push('Secure context: ' + (window.isSecureContext ? 'yes' : 'no'));
    lines.push('navigator.mediaDevices: ' + (navigator.mediaDevices ? 'present' : 'missing'));
    lines.push('getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'present' : 'missing'));
    try {
      const pp = document.permissionsPolicy || document.featurePolicy;
      lines.push('Frame allows camera: ' + (pp && pp.allowsFeature ? (pp.allowsFeature('camera') ? 'yes' : 'NO (blocked by the page frame)') : 'unknown in this browser'));
    } catch (e) { lines.push('Frame allows camera: unknown'); }
    try { lines.push('In a frame: ' + (window.self !== window.top ? 'yes' : 'no')); } catch (e) { lines.push('In a frame: yes (cross-origin)'); }
    lines.push('Browser: ' + navigator.userAgent);
    return lines.join('\n');
  }
  function renderCamera() {
    const V = $('#view');
    const on = !!CAM.stream;
    let h = '<div><button class="back" type="button" data-go="runs">← All runs</button></div>';
    h += '<div class="head"><div><div class="eyebrow">Live camera · test only</div><h1>Camera test</h1><p class="sub">Checks whether this page can open your camera (rear camera preferred). Nothing is recorded, saved or sent anywhere.</p></div><div class="actions">';
    h += on ? '<button class="btn" type="button" data-act="cam-stop">Stop camera</button>' : '<button class="btn primary" type="button" data-act="cam-start"' + (CAM.busy ? ' disabled' : '') + '>' + (CAM.busy ? 'Opening camera…' : 'Start camera') + '</button>';
    if (CAM.devices.length) h += '<label class="cmp-pick"><span>Camera</span><select class="in" id="cam-select">' + CAM.devices.map((d, i) => '<option value="' + esc(d.deviceId) + '"' + (d.deviceId === CAM.deviceId ? ' selected' : '') + '>' + esc(d.label || 'Camera ' + (i + 1)) + '</option>').join('') + '</select></label>';
    h += '</div></div>';
    h += '<div class="panel pad sec"><video id="cam-video" class="cam-view" autoplay muted playsinline' + (on ? '' : ' hidden') + '></video>';
    if (!on && !CAM.error) h += '<p class="ink2">Press Start camera. Your browser should ask for camera permission.</p>';
    if (CAM.info) h += '<p class="cam-err ink2">' + esc(CAM.info) + '</p>';
    if (CAM.error) {
      h += '<div class="notice err cam-err">' + esc(CAM.error) + '</div>';
      h += '<div class="sec"><p class="ink2">Live preview isn’t available here. You can still record a cycle with the phone’s camera and analyze it right away:</p><div><label class="btn primary" for="cam-rec">Record with phone camera</label><input class="sr" type="file" id="cam-rec" accept="video/*" capture="environment"></div></div>';
    }
    h += '</div>';
    h += '<details class="panel diag"' + (CAM.error ? ' open' : '') + '><summary>Browser details</summary><div class="pad cam-err ink2">' + esc(camEnv()) + '</div></details>';
    V.innerHTML = h;
    const cr = $('#cam-rec');
    if (cr) cr.addEventListener('change', () => { const f = cr.files && cr.files[0]; if (f) { go('new'); loadFile(f); } });
    const v = $('#cam-video');
    if (v && CAM.stream) { v.srcObject = CAM.stream; v.play().catch(() => {}); }
  }
  async function camStart() {
    if (CAM.busy || CAM.stream) return;
    CAM.error = ''; CAM.info = ''; CAM.busy = true;
    renderCamera();
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw { name: 'NotSupported', message: 'navigator.mediaDevices.getUserMedia is not available here' + (window.isSecureContext ? '.' : ' (page is not a secure context).') };
      }
      const video = CAM.deviceId ? { deviceId: { exact: CAM.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } };
      const stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
      if (S.route.view !== 'camera') { stream.getTracks().forEach(t => t.stop()); return; }
      CAM.stream = stream;
      const tr = stream.getVideoTracks()[0];
      const st = tr && tr.getSettings ? tr.getSettings() : {};
      // Labels are only filled in after permission is granted, so list cameras now.
      try { CAM.devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) { CAM.devices = []; }
      CAM.deviceId = st.deviceId || CAM.deviceId;
      CAM.info = 'Camera open: ' + ((tr && tr.label) || 'unnamed camera') + '\n' + [st.facingMode ? 'facing ' + st.facingMode : 'facing not reported', st.width && st.height ? st.width + '×' + st.height : null, st.frameRate ? Math.round(st.frameRate) + ' fps' : null].filter(Boolean).join(' · ');
      if (tr) tr.addEventListener('ended', () => { CAM.stream = null; CAM.error = 'Camera stopped: the track ended (camera disconnected, or another app took it).'; if (S.route.view === 'camera') renderCamera(); });
    } catch (e) {
      CAM.error = 'Camera failed\n' + ((e && e.name) || 'Error') + ': ' + ((e && e.message) || String(e)) + (e && e.constraint ? '\nConstraint: ' + e.constraint : '');
    } finally {
      CAM.busy = false;
    }
    if (S.route.view === 'camera') renderCamera();
  }
  function camStop() {
    if (CAM.stream) { CAM.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { /* ignore */ } }); }
    CAM.stream = null;
    const v = $('#cam-video'); if (v) v.srcObject = null;
  }

  // ---------- leave confirm ----------
  function renderLeaveConfirm() {
    let box = $('#leave');
    if (!box) {
      box = document.createElement('div');
      box.id = 'leave';
      box.className = 'confirm';
      $('#view').prepend(box);
    }
    box.innerHTML = '<span>Leave without saving this run? The timings you’ve set will be lost.</span><span class="spacer"></span><button class="btn sm danger" type="button" data-act="leave-yes">Discard and leave</button><button class="btn sm" type="button" data-act="leave-no">Keep editing</button>';
    box.scrollIntoView({ block: 'nearest' });
  }

  // ---------- tooltip & toast ----------
  const tip = $('#tip');
  function showTip(el, x, y) {
    const t = el.getAttribute('data-tip');
    if (!t) return;
    tip.textContent = t;
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('scroll', hideTip, { passive: true });
  let toastTimer = 0;
  function toast(t) {
    const el = $('#toast');
    el.textContent = t;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const goEl = t.closest('[data-go]');
    if (goEl) { e.preventDefault(); go(goEl.getAttribute('data-go')); return; }
    const act = t.closest('[data-act]');
    if (act) { onAct(act.getAttribute('data-act'), act, e); return; }
    const track = t.closest('.track.seekable');
    if (track) {
      const r = track.getBoundingClientRect();
      const span = +track.dataset.span, t0 = +track.dataset.t0 || 0;
      seekActive(t0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * span);
      return;
    }
    const sk = t.closest('[data-seek]');
    if (sk && (S.route.view === 'run' || S.route.view === 'edit' || S.route.view === 'new')) { seekActive(+sk.getAttribute('data-seek'), true); return; }
    const op = t.closest('[data-open]');
    if (op) { go('run', op.getAttribute('data-open')); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.tl-row[data-open]')) { e.preventDefault(); go('run', e.target.getAttribute('data-open')); }
  });
  function onAct(a, el) {
    const d = S.draft;
    const run = S.route.view === 'run' ? S.runs.find(r => r.id === S.route.id) : null;
    switch (a) {
      case 'edit': if (run) go('edit', run.id); break;
      case 'make-baseline': if (run) makeBaseline(run); break;
      case 'delete': S.confirmDelete = true; S.renderedKey = null; render(); break;
      case 'delete-no': S.confirmDelete = false; S.renderedKey = null; render(); break;
      case 'delete-yes': if (run) deleteRun(run); break;
      case 'export': exportCsv(); break;
      case 'cam-start': camStart(); break;
      case 'cam-stop': camStop(); CAM.info = ''; renderCamera(); break;
      case 'copy-csv': {
        const ta = $('#csv-out');
        if (!ta) break;
        const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(ta.value) : Promise.reject();
        p.then(() => toast('Copied'), () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C or ⌘C to copy.'); });
        break;
      }
      case 'replace-file': dropDraft(); S.draft = { stage: 'pick' }; renderNew(); break;
      case 'analyze': analyze(); break;
      case 'manual': startManual(); break;
      case 'cc-analyze': ccAnalyze(el); break;
      case 'cc-retry': if (run) { el.disabled = true; ccRetry(run); } break;
      case 'cc-manual': if (run) go('edit', run.id); break;
      case 'cc-recheck': if (run) { el.disabled = true; ccRecheck(run, refFor(run)); } break;
      case 'copy-cc': {
        const m = $('#cc-msg');
        if (!m) break;
        const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(m.textContent) : Promise.reject();
        p.then(() => toast('Copied. Paste it into Claude Code.'), () => { const r = document.createRange(); r.selectNodeContents(m); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Press Ctrl+C or ⌘C to copy.'); });
        break;
      }
      case 'stop': if (d && d.ctl) d.ctl.abort(); if (d) { d.cancelled = true; d.stage = 'loaded'; setTimeout(() => { if (S.draft === d) { d.cancelled = false; renderNew(); } }, 0); } break;
      case 'nudge': { const v = $('#ed-video'); if (v) { v.pause(); v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + (+el.dataset.d))); } break; }
      case 'speed': { const v = $('#ed-video'); if (v) { v.playbackRate = v.playbackRate === 1 ? 0.5 : v.playbackRate === 0.5 ? 0.25 : 1; el.textContent = (v.playbackRate === 1 ? '0.5' : v.playbackRate === 0.5 ? '0.25' : '1') + '×'; toast('Playback ' + v.playbackRate + '×'); } break; }
      case 'set-time': {
        const v = $('#ed-video');
        if (!v || !d) break;
        const t = r2(v.currentTime || 0);
        if (el.dataset.scope === 'cyc') { d.cycle[el.dataset.field] = t; d.finalState.frameDirty = true; d.dirty = true; const inp = $('#cyc-' + el.dataset.field); if (inp) inp.value = t.toFixed(2); }
        else {
          const e2 = findEl(el.dataset.uid);
          if (!e2) break;
          setElTime(e2, el.dataset.field, t);
          const inp = $('#el-' + e2.uid + '-' + el.dataset.field); if (inp) inp.value = t.toFixed(2);
          const du = $('#el-' + e2.uid + '-dur'); if (du) du.textContent = fmtS(dur(e2));
          resortIfNeeded();
        }
        refreshDerived();
        break;
      }
      case 'add-el': {
        if (!d) break;
        const v = $('#ed-video');
        const t = r2(v ? v.currentTime || 0 : (d.cycle.end || 0));
        const ne = { uid: uid(), key: 'other', label: '', kind: 'other', start: t, end: r2(Math.min(t + 0.3, d.meta.durationS || t + 0.3)), observed: '', flagType: 'note', flag: '' };
        d.elements.push(ne); d.dirty = true;
        d.elements.sort(byStartUnsetLast);
        renderEls(); refreshDerived();
        const inp = document.getElementById('el-' + ne.uid + '-label'); if (inp) inp.focus();
        break;
      }
      case 'rm-el': if (d) { d.elements = d.elements.filter(x => x.uid !== el.dataset.uid); d.dirty = true; renderEls(); refreshDerived(); } break;
      case 'save': if (d && !d.saving) saveDraft(); break;
      case 'save-untimed': if (d && !d.saving && d.mode === 'new') ccAnalyze(el); break;
      case 'cancel-edit': if (d && d.mode === 'edit') go('run', d.runId); else go('runs'); break;
      case 'leave-yes': { const to = S.leaveTo; S.leaveTo = null; if (d) d.dirty = false; go(to ? to.view : 'runs', to && to.id, true); break; }
      case 'leave-no': { S.leaveTo = null; const b = $('#leave'); if (b) b.remove(); break; }
    }
  }
  document.addEventListener('input', e => {
    const t = e.target;
    const d = S.draft;
    if (!d) return;
    if (t.dataset.df) {
      const f = t.dataset.df;
      if (f === 'finalNote') d.finalState.note = t.value;
      else if (f === 'match') d.finalState.matchesBaseline = t.value;
      else d[f] = t.value;
      d.dirty = true;
      return;
    }
    if (t.dataset.cyc) {
      const v = parseFloat(t.value);
      d.cycle[t.dataset.cyc] = fin(v) ? r2(v) : NaN;
      d.finalState.frameDirty = true;
      d.dirty = true;
      refreshDerived();
      return;
    }
    if (t.dataset.uid && t.dataset.f) {
      const el = findEl(t.dataset.uid);
      if (!el) return;
      const f = t.dataset.f;
      if (f === 'start' || f === 'end') {
        const v = parseFloat(t.value);
        if (fin(v)) setElTime(el, f, v); else el[f] = NaN;
        const du = $('#el-' + el.uid + '-dur'); if (du) du.textContent = fmtS(dur(el));
        refreshDerived();
      } else if (f === 'label' || f === 'observed' || f === 'flag') {
        el[f] = t.value; d.dirty = true;
        if (f === 'label') refreshDerived();
      }
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'cmp-select') { const run = S.runs.find(r => r.id === S.route.id); if (run && t.value) setCompare(run, t.value); return; }
    if (t.id === 'base-select') { if (t.value) setBaseline(t.value); return; }
    if (t.id === 'cam-select') { CAM.deviceId = t.value; camStop(); camStart(); return; }
    const d = S.draft;
    if (!d) return;
    if (t.dataset.uid && t.dataset.f) {
      const el = findEl(t.dataset.uid);
      if (!el) return;
      const f = t.dataset.f;
      if (f === 'key') {
        const c = catalog().find(x => x.key === t.value);
        if (c) { el.key = c.key; el.label = c.label; el.kind = c.kind; }
        else { el.key = 'other'; el.label = ''; el.kind = 'other'; }
        d.dirty = true; renderEls(); refreshDerived();
        if (!c) { const inp = document.getElementById('el-' + el.uid + '-label'); if (inp) inp.focus(); }
      } else if (f === 'kind' || f === 'flagType') {
        el[f] = t.value; d.dirty = true; renderEls(); refreshDerived();
      } else if (f === 'start' || f === 'end') {
        resortIfNeeded(); refreshDerived();
      }
    }
  });

  // ---------- boot ----------
  document.addEventListener('securitypolicyviolation', e => {
    const what = (e.effectiveDirective || e.violatedDirective || 'policy') + ' ' + String(e.blockedURI || '').slice(0, 40);
    if (!S.diag.csp.includes(what)) S.diag.csp.push(what);
  });
  if (LOCAL) {
    const p = document.createElement('p');
    p.textContent = 'Running locally: runs and videos live in the data/ folder of this repo. Commit and push data/ to share them with your team.';
    const foot = $('.foot'); if (foot) foot.appendChild(p);
  }
  render();
  init();
})();
</script>
