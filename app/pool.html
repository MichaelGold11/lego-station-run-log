<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef0ee; --surface: #fcfcfb; --surface-2: #f3f4f2; --sunk: #e4e7e4;
  --ink: #15181b; --ink-2: #4a4f56; --muted: #767b83; --line: #dcdfdc; --line-2: #c5c9c5;
  --accent: #a3522a; --accent-2: #8a4321; --on-accent: #ffffff; --accent-wash: rgba(163, 82, 42, .09);
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5200; --crit: #d03b3b; --crit-ink: #b02e2e;
  --shadow: 0 1px 2px rgba(21, 24, 27, .06);
  --f-ui: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #181a1d; --surface-2: #1f2225; --sunk: #0c0d0f;
    --ink: #eff1ef; --ink-2: #bfc3c8; --muted: #8a8f96; --line: #2a2e33; --line-2: #3a3f45;
    --accent: #dc8b55; --accent-2: #e9a273; --on-accent: #15181b; --accent-wash: rgba(220, 139, 85, .14);
    --good-ink: #3fbf3f; --warn-ink: #fab219; --crit-ink: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.4; }
h1, h2, h3 { margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 12px; min-height: 34px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.sm { padding: 2px 9px; min-height: 28px; font-size: 12.5px; }
.btn.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-2); }
.btn.pass { border-color: color-mix(in srgb, var(--good) 60%, var(--line-2)); color: var(--good-ink); }
.btn.fail { border-color: color-mix(in srgb, var(--crit) 55%, var(--line-2)); color: var(--crit-ink); }
.btn.pass.on { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.btn.fail.on { background: color-mix(in srgb, var(--crit) 12%, var(--surface)); }
kbd { font-family: var(--f-mono); font-size: 11px; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; line-height: 18px; }
.chip.good { border-color: color-mix(in srgb, var(--good) 60%, var(--line-2)); color: var(--good-ink); }
.chip.bad { border-color: color-mix(in srgb, var(--crit) 55%, var(--line-2)); color: var(--crit-ink); }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 70%, var(--line-2)); color: var(--warn-ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.pad { padding: 12px 14px; }

.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.top h1 { font-size: 17px; }
.top .sp { flex: 1; }
main { max-width: 1180px; margin: 0 auto; padding: 14px 16px 80px; display: grid; gap: 14px; }
.banner { padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); color: var(--ink-2); }
.banner.bad { border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 8%, var(--surface)); color: var(--ink); }

.slist { display: grid; gap: 10px; }
.srow { display: grid; gap: 6px; padding: 12px 14px; text-decoration: none; color: inherit; }
.srow:hover { border-color: var(--ink-2); }
.srow .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.srow .h b { font-size: 15px; }
.rates { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }

.prog { display: grid; gap: 6px; }
.prog .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.grp { display: grid; gap: 8px; }
.grp h2 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.grp h3 { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { display: grid; gap: 8px; padding: 10px; align-content: start; scroll-margin-top: 70px; }
.card.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
.card.v-confirmed { border-left: 4px solid var(--good); }
.card.v-corrected { border-left: 4px solid var(--accent); }
.card.v-rejected { border-left: 4px solid var(--crit); }
.card.v-unsure { border-left: 4px solid var(--warn); }
.shot { position: relative; background: var(--sunk); border-radius: 6px; overflow: hidden; line-height: 0; }
.shot img { width: 100%; height: auto; display: block; }
.shot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.claim { font-size: 14px; font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.clipbar { display: flex; gap: 6px; align-items: center; }
.clip { width: 100%; max-height: 360px; border-radius: 6px; background: #000; display: block; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.acts .btn { min-height: 42px; }
.acts2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.modal { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); overflow: auto; padding: 12px; }
.modal .box { max-width: 900px; margin: 0 auto; display: grid; gap: 10px; }
.editor { position: relative; background: var(--sunk); border-radius: 6px; overflow: hidden; line-height: 0; touch-action: none; user-select: none; cursor: crosshair; }
.editor img { width: 100%; height: auto; display: block; pointer-events: none; }
.editor svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.blist { display: grid; gap: 6px; }
.brow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.brow.off { opacity: .55; }
.brow .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.brow select { padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); min-height: 32px; }
.brow .sp { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: 90vw; }
.toast.err { background: var(--crit); color: #fff; }
@media (max-width: 560px) {
  main { padding: 10px 10px 80px; }
  .grid { grid-template-columns: 1fr; }
  .top { padding: 8px 10px; }
  .kbdhint { display: none; }
}
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sec { display: grid; gap: 10px; }
.sec h2 { font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.cls { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
.cls i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
select, input[type=text] { padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); min-height: 34px; }
.mono { font-family: var(--f-mono); }
@media (max-width: 560px) { main { padding: 10px 10px 80px; } .tbl { font-size: 12px; } }
</style>
</head>
<body>
<header class="top">
  <h1>Shared pool</h1>
  <a class="btn sm" href="/review">Review frames</a>
  <a class="btn sm" href="/line">Back to the line</a>
  <span class="sp"></span>
  <span class="muted" id="where"></span>
</header>
<main id="main"><div class="muted">Loading...</div></main>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PALETTE = ['#e4572e', '#17bebb', '#f0b429', '#7a5af8', '#2e9e44', '#d6409f', '#2d7dd2', '#a3522a'];
  const colorMemo = {};
  const colorOf = cls => { if (!colorMemo[cls]) colorMemo[cls] = PALETTE[Object.keys(colorMemo).length % PALETTE.length]; return colorMemo[cls]; };
  let toastTimer = 0;
  function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 6000 : 2500); }
  const classes = by => { const k = Object.keys(by || {}).sort(); return k.length ? '<div class="cls">' + k.map(c => `<span><i style="background:${colorOf(c)}"></i>${esc(c)} <b class="mono">${by[c]}</b></span>`).join('') + '</div>' : '<span class="muted">no boxes</span>'; };

  async function load() {
    const main = $('main');
    let j;
    try {
      const r = await fetch('/api/pool', { cache: 'no-store' });
      j = await r.json();
      if (!r.ok) throw new Error(j && j.message || 'HTTP ' + r.status);
    } catch (e) { main.innerHTML = '<div class="banner bad">The pool could not be read. ' + esc(e.message) + '</div>'; return; }
    $('where').textContent = j.dir;
    const roles = Object.keys(j.stations).sort();
    if (!roles.length) {
      main.innerHTML = '<div class="banner">Nothing in the pool yet. Review frames in a session, then press Publish to pool on the review page. To share with the team, set <span class="mono">"pool": { "dir": "&lt;your synced Drive folder&gt;" }</span> in data/meta/wire-line.json.</div>';
      return;
    }
    main.innerHTML = roles.map(role => {
      const st = j.stations[role], codes = Object.keys(st.byContributor).sort();
      const contribs = j.contributions.filter(c => c.station === role);
      return `<section class="panel pad sec" data-role="${esc(role)}">
        <h2>Station ${esc(role)} <span class="muted mono" style="font-size:12.5px;font-weight:400">${st.images} reviewed frame${st.images === 1 ? '' : 's'}, ${st.negatives} with no box, ${st.contributions} contribution${st.contributions === 1 ? '' : 's'}</span></h2>
        <div><div class="eyebrow">Boxes per class</div>${classes(st.byClass)}</div>
        <div><div class="eyebrow">Per contributor</div>
          <table class="tbl"><thead><tr><th>Code</th><th>Contributions</th><th>Frames</th><th>Boxes per class</th></tr></thead><tbody>
          ${codes.map(c => { const x = st.byContributor[c]; return `<tr><td class="mono">${esc(c)}</td><td>${x.contributions}</td><td>${x.images}</td><td>${classes(x.byClass)}</td></tr>`; }).join('')}
          </tbody></table></div>
        <div class="muted">By way in: ${Object.keys(st.byMode).map(m => `${esc(m)} ${st.byMode[m].images} frames`).join(', ')}</div>
        <details><summary class="muted">Contributions (${contribs.length})</summary>
          <table class="tbl"><thead><tr><th>Folder</th><th>Way in</th><th>Frames</th><th>Published</th></tr></thead><tbody>
          ${contribs.map(c => `<tr><td class="mono">${esc(c.folder)}</td><td>${esc(c.mode)}</td><td>${c.images}</td><td class="muted">${esc((c.publishedAt || '').replace('T', ' ').slice(0, 16))}</td></tr>`).join('')}
          </tbody></table></details>
        <div class="row">
          <label class="muted">Hold out as test
            <select data-hold><option value="">nobody (split by session)</option>${codes.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
          <a class="btn primary" data-snap href="/api/pool/${encodeURIComponent(role)}/snapshot.zip" download>Download ${esc(role)} snapshot</a>
        </div>
        <div class="muted">The snapshot is a YOLO set (train, val, test, data.yaml). Whole sessions go to one side, never single frames; a held-out contributor's data is all test.</div>
      </section>`;
    }).join('');
    main.querySelectorAll('.sec').forEach(sec => {
      const sel = sec.querySelector('[data-hold]'), a = sec.querySelector('[data-snap]'), base = a.getAttribute('href');
      sel.onchange = () => { a.setAttribute('href', base + (sel.value ? '?holdout=' + encodeURIComponent(sel.value) : '')); };
    });
  }
  load();
})();
</script>
</body>
</html>
