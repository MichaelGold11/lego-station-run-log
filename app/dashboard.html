<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Wire Line Dashboard</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column of cards, max 1120px. Header, tab bar, then one view. Detail lives in native details dropdowns. */
:root {
  --bg: #eef0ee; --surface: #fcfcfb; --surface-2: #f3f4f2; --sunk: #e4e7e4;
  --ink: #15181b; --ink-2: #4a4f56; --muted: #6c7179; --line: #dcdfdc; --line-2: #c5c9c5;
  --accent: #a3522a; --accent-2: #8a4321; --on-accent: #ffffff; --accent-wash: rgba(163, 82, 42, .09);
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5200; --crit: #d03b3b; --crit-ink: #b02e2e;
  --bar: #5f7688; --c1: #2f7f8f; --c2: #7a6aa6; --c3: #7b8a3a;
  --k1: #c3d0da; --k2: #a3b6c5; --k3: #839bae; --k4: #637f94; --k5: #46647b; --k6: #2e4a61;
  --ph-bg: #dfe3df; --ph-tray: #cdd2cd; --ph-part: #8d949b;
  --shadow: 0 1px 2px rgba(21, 24, 27, .06);
  --f-ui: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #181a1d; --surface-2: #1f2225; --sunk: #0c0d0f;
    --ink: #eff1ef; --ink-2: #bfc3c8; --muted: #959aa1; --line: #2a2e33; --line-2: #3a3f45;
    --accent: #dc8b55; --accent-2: #e9a273; --on-accent: #15181b; --accent-wash: rgba(220, 139, 85, .14);
    --good-ink: #3fbf3f; --warn-ink: #fab219; --crit-ink: #e66767;
    --bar: #7d95a8; --c1: #4fb0c2; --c2: #a898d6; --c3: #a6b85c;
    --k1: #2f4254; --k2: #3d566c; --k3: #4f6d86; --k4: #6788a1; --k5: #86a5bc; --k6: #aac4d6;
    --ph-bg: #23272b; --ph-tray: #2e3338; --ph-part: #6f777f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #181a1d; --surface-2: #1f2225; --sunk: #0c0d0f;
  --ink: #eff1ef; --ink-2: #bfc3c8; --muted: #959aa1; --line: #2a2e33; --line-2: #3a3f45;
  --accent: #dc8b55; --accent-2: #e9a273; --on-accent: #15181b; --accent-wash: rgba(220, 139, 85, .14);
  --good-ink: #3fbf3f; --warn-ink: #fab219; --crit-ink: #e66767;
  --bar: #7d95a8; --c1: #4fb0c2; --c2: #a898d6; --c3: #a6b85c;
  --k1: #2f4254; --k2: #3d566c; --k3: #4f6d86; --k4: #6788a1; --k5: #86a5bc; --k6: #aac4d6;
  --ph-bg: #23272b; --ph-tray: #2e3338; --ph-part: #6f777f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-2); }
.mono, td.num, th.num, .big, .brow .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; word-spacing: -.3em; }   /* one gap, not a double monospace space */
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.sm { min-height: 44px; padding: 4px 12px; font-size: 13px; }
.btn.on, .chipbtn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-2); }
kbd { font-family: var(--f-mono); font-size: 11px; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
.btn.primary kbd { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .35); color: inherit; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; line-height: 20px; }
.chip.warn { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.chip.crit { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 50%, transparent); background: color-mix(in srgb, var(--crit) 8%, transparent); }
.chip.good { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.chip.quiet { color: var(--muted); font-weight: 500; }
.chipbtn { min-height: 44px; padding: 4px 14px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; }
.chipbtn:hover { border-color: var(--ink-2); }
select, input[type="text"], input[type="number"], input[type="date"], textarea { min-height: 44px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); padding: 6px 10px; font-size: 14px; max-width: 100%; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 42px; padding: 4px 14px; cursor: pointer; font-size: 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent-2); font-weight: 600; }

/* header */
.hdr { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 26px; line-height: 1.1; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.ctl label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.ctl label > .seg, .ctl label > select { text-transform: none; letter-spacing: 0; font-weight: 500; }
.ctl .grp { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line-2); scrollbar-width: thin; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; text-decoration: none; color: var(--ink-2); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent-2); border-bottom-color: var(--accent); font-weight: 600; }
.badge { font-family: var(--f-mono); font-size: 12px; min-width: 22px; padding: 0 6px; line-height: 20px; border-radius: 10px; background: var(--accent); color: var(--on-accent); text-align: center; }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.headline { font-size: 22px; line-height: 1.25; font-weight: 600; max-width: 62ch; text-wrap: balance; }
.sub { color: var(--ink-2); max-width: 62ch; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 16px; text-align: left; width: 100%; cursor: pointer; color: inherit; font: inherit; }
button.card:hover { border-color: var(--ink-2); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .sent { color: var(--ink); flex: 1; }
.big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 40px; line-height: 1; font-weight: 500; }
.big small { word-spacing: 0; font-size: 15px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec-h h2 { font-size: 17px; }

/* details dropdowns */
details.dd { border-top: 1px solid var(--line); }
details.dd > summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
details.dd > summary::-webkit-details-marker { display: none; }
details.dd > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .12s; margin: 0 4px 0 2px; flex: none; }
details.dd[open] > summary::before { transform: rotate(45deg); }
details.dd > .body { padding: 4px 0 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* tables */
.tbl { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; background: var(--surface-2); white-space: nowrap; }
td { padding: 8px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl.tall { max-height: 280px; overflow-y: auto; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* training rows */
.grp-h { display: flex; flex-direction: column; gap: 6px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 170px 130px; gap: 10px; padding: 0 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
details.row { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 170px 130px; gap: 10px; align-items: center; min-height: 52px; padding: 4px 12px; }
details.row > summary::-webkit-details-marker { display: none; }
details.row[open] > summary { border-bottom: 1px solid var(--line); }
details.row > .body { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rname { font-weight: 500; min-width: 0; }
.rname small { display: block; color: var(--muted); font-size: 12px; }
.spread { width: 160px; height: 18px; display: block; }
.sv-track { fill: var(--sunk); } .sv-box { fill: var(--bar); } .sv-dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; } .sv-std { stroke: var(--accent); stroke-width: 2; }
.diag { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.diag p { flex: 1; min-width: 220px; max-width: 62ch; }

/* charts */
.bars { display: flex; flex-direction: column; gap: 10px; }
.brow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; min-height: 32px; }
.brow .lab { font-size: 13.5px; min-width: 0; }
.track { position: relative; height: 18px; background: var(--sunk); border-radius: 4px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.fill.hot { background: var(--crit); }
.takt { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stk { display: flex; gap: 2px; height: 28px; width: 100%; }
.stk > div { height: 100%; min-width: 3px; border-radius: 3px; }
.cols-chart { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding-top: 18px; border-bottom: 1px solid var(--line-2); position: relative; }
.cc { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; gap: 3px; }
.cc .v { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.cc .b { width: 100%; max-width: 56px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.cc-l { display: flex; gap: 10px; }
.cc-l span { flex: 1; text-align: center; font-size: 12px; color: var(--muted); min-width: 0; }
.curve { width: 100%; max-width: 420px; height: auto; display: block; }
.curve text { font-family: var(--f-mono); font-size: 9px; fill: var(--muted); }
.curve .std { stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 1.5; fill: none; }
.curve .ax { stroke: var(--line-2); stroke-width: 1; fill: none; }
.curve .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mini { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.mini .mono { font-size: 28px; }

/* inbox */
.inbox-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; width: 160px; }
.meter > i { display: block; height: 100%; background: var(--bar); }
.qcard { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.qtitle { font-size: 20px; font-weight: 600; max-width: 56ch; }
.photo { position: relative; max-width: 460px; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.photo svg { display: block; width: 100%; height: auto; }
.photo .tag { position: absolute; left: 8px; top: 8px; }
.ph-bg { fill: var(--ph-bg); } .ph-tray { fill: var(--ph-tray); stroke: var(--line-2); stroke-width: 1; }
.ph-wire { fill: none; stroke: var(--ph-part); stroke-width: 5; stroke-linecap: round; }
.ph-part { fill: var(--ph-part); } .ph-look { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 8 5; }
.ph-txt { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); } .ph-play { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; opacity: .95; } .ph-tri { fill: var(--ink-2); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.say { padding: 10px 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); max-width: 62ch; }
.say b { font-weight: 600; }
.tl { position: relative; height: 22px; background: var(--sunk); border-radius: 4px; cursor: pointer; max-width: 460px; }
.tl .span { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 4px; }
.tl .ph { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
.tl-l { display: flex; justify-content: space-between; max-width: 460px; font-size: 12px; color: var(--muted); }
.playbtn { cursor: pointer; }
.qlist { display: flex; flex-direction: column; gap: 6px; }
.qitem { display: flex; gap: 10px; align-items: center; justify-content: space-between; min-height: 52px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.qitem:hover { border-color: var(--ink-2); }
.qitem .t { min-width: 0; flex: 1; }
.empty { padding: 28px 18px; text-align: center; }
.empty b { display: block; font-size: 18px; margin-bottom: 4px; }
.bul { margin: 0; padding-left: 20px; }
.bul li { margin: 3px 0; }

/* rules */
.rule { display: flex; align-items: center; gap: 12px; padding: 12px 14px; justify-content: space-between; }
.rule .txt { min-width: 0; flex: 1; }
.rule b { font-family: var(--f-mono); font-weight: 500; background: var(--accent-wash); padding: 0 5px; border-radius: 4px; }
.sw { width: 52px; height: 44px; border: 0; background: transparent; cursor: pointer; padding: 0; flex: none; display: grid; place-items: center; }
.sw i { width: 40px; height: 22px; border-radius: 11px; background: var(--line-2); position: relative; transition: background .12s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .12s; box-shadow: var(--shadow); }
.sw[aria-checked="true"] i { background: var(--accent); }
.sw[aria-checked="true"] i::after { left: 21px; }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; line-height: 1.2; }
.sentence input[type="number"] { width: 76px; }
.sentence select, .sentence input[type="text"] { max-width: 100%; }
.res { border-left: 3px solid var(--good); padding: 8px 12px; background: var(--surface-2); border-radius: 0 6px 6px 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
.foot { color: var(--muted); font-size: 12.5px; }

@media (max-width: 780px) {
  .cols { display: none; }
  details.row > summary { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; padding: 8px 12px; }
  details.row > summary .rname { grid-column: 1 / -1; }
  details.row > summary .nstd, details.row > summary .nmed { display: inline; }
  details.row > summary .nstd::before { content: "Standard "; color: var(--muted); font-family: var(--f-ui); }
  details.row > summary .nmed::before { content: "Median "; color: var(--muted); font-family: var(--f-ui); }
  .spread { width: 100%; max-width: 200px; }
  .brow { grid-template-columns: 96px minmax(0, 1fr) 56px; gap: 8px; }
  .headline { font-size: 20px; }
}
.sk { table-layout: fixed; min-width: 0; }
.sk td, .sk th { white-space: normal; vertical-align: top; }
.sk td.opc { font-family: var(--f-mono); width: 64px; }
.sk .lv { font-weight: 600; display: block; }
.sk .why { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.sk .btn { min-height: 44px; padding: 4px 10px; margin-top: 4px; }
@media (max-width: 560px) {
  .ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; }
  .ctl > label:first-child { grid-column: 1 / -1; }
  .ctl > label:first-child .seg { display: flex; }
  .ctl > label:first-child .seg button { flex: 1; padding: 4px 6px; }
  .ctl select { width: 100%; }
  .ctl .grp { flex-wrap: wrap; min-width: 0; }
  .ctl .grp label { min-width: 0; }
  .ctl .grp .seg { display: flex; }
  .ctl .grp .seg button { flex: 1; padding: 4px 8px; }
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; gap: 0; border-bottom: 0; }
  .tabs a { justify-content: center; padding: 0 4px; border: 1px solid var(--line); margin: 0 -1px -1px 0; border-bottom-width: 3px; }
  .tabs a[aria-current="page"] { border-color: var(--line); border-bottom-color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="brand">
      <div><div class="eyebrow">Dashboard</div><h1>Wire line</h1></div>
      <span class="chip quiet" id="sample" title="Numbers on this page are generated, not recorded.">Sample data</span>
    </div>
    <div class="ctl">
      <label>Period
        <span class="seg" id="period" role="group" aria-label="Period">
          <button type="button" data-period="session">Session</button><button type="button" data-period="today">Today</button><button type="button" data-period="week">Week</button><button type="button" data-period="month">Month</button>
        </span>
      </label>
      <label for="station">Station

  { s1: [7, 14, 11], s2: [2, 11, 19], s3: [14, 7, 2], s4: [2, 23, 7] },
  { s1: [2, 14, 23], s2: [7, 11, 19], s3: [2, 14, 11], s4: [7, 23, 14] },
  { s1: [7, 2, 14], s2: [14, 11, 19], s3: [7, 2, 19], s4: [2, 23, 14] },
  { s1: [2, 14, 11], s2: [7, 11, 19], s3: [14, 7, 2], s4: [7, 23, 2] },

// How slow each operator is on each step, as a multiple of the standard. Planted cases live here.
function factor(code, subId, n) {
  const learn = Math.exp(-n / 30);

  if (code === 'Op-02') f = 0.97; else if (code === 'Op-07') f = 1.0; else if (code === 'Op-14') f = 1.03;
  else if (code === 'Op-11') f = 1.04 + 0.2 * learn; else if (code === 'Op-19') f = 1.08 + 0.2 * learn; else f = 1.05 + 0.18 * learn;

  const f = filters || {}, sel = SHIFTS.filter(PERIODS[f.period || 'week']), ids = new Set(sel.map(s => s.id));

    cycles: inP.filter(c => !f.station || f.station === 'all' || c.st === f.station),

/* ============ Analysis (pure functions of the rows) ============ */
const med = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

const nb = (n, unit) => n + '\u00a0' + unit;   // the one place a number meets its unit: never breaks across lines
const sec = v => nb(f1(v), 's');
const pct = v => Math.round(v * 100);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

function opStats(rows, D) {
  const by = {}; rows.forEach(r => (by[r.op] = by[r.op] || []).push(r));
  return D.operators.filter(o => by[o.code]).map(o => {
    const a = by[o.code].slice().sort((x, y) => x.n - y.n), secs = a.map(r => r.sec), k = Math.max(1, Math.floor(a.length / 3));
    const first = med(secs.slice(0, k)), last = med(secs.slice(-k));

      trend: a.length < 6 ? 'Too few' : last < first * 0.93 ? 'Faster' : last > first * 1.07 ? 'Slower' : 'Steady' };

const TAGS = {
  process: { label: 'Process', word: 'Slow', tone: 'crit' },
  training: { label: 'Training', word: 'Still learning', tone: 'warn' },
  coaching: { label: 'Training', word: 'Needs coaching', tone: 'warn' },
  technique: { label: 'Technique', word: 'Varies', tone: 'warn' },
  inconsistent: { label: 'Inconsistent', word: 'Varies', tone: '' },
  drift: { label: 'Drift', word: 'Slow', tone: 'warn' },
  pace: { label: 'On pace', word: 'On pace', tone: 'good' },
  few: { label: 'Few cycles', word: 'Few cycles', tone: 'quiet' }

// rows: [{op, n, sec, sh}] for one step. Returns the tag, the sentence and the evidence behind it.
function diagnose(D, rows, std) {
  const SF = D.config.slowFactor, all = rows.map(r => r.sec), ops = opStats(rows, D).filter(o => o.n >= 5);

  if (all.length < 5 || !ops.length) { r.tag = 'few'; r.text = 'Not enough cycles yet in this period.'; return r; }
  const slow = ops.filter(o => o.med > std * SF && o.med - std >= 0.6), slowCert = slow.filter(o => o.level === 'certified'), cert = ops.filter(o => o.level === 'certified');
  const stdTxt = ' against a ' + sec(std) + ' standard';
  if (slow.length && slow.length / ops.length >= 0.5 && slowCert.length) {
    r.tag = 'process'; r.who = slow.map(o => o.op);
    r.text = 'Slow for ' + slow.length + ' of ' + ops.length + ' operators, including certified ones. The median is ' + sec(r.med) + stdTxt + '. Look at the step, the fixture or the written steps.';
    return r;
  }
  if (slow.length && !slowCert.length) {
    const a = slow.reduce((s, o) => s + o.first, 0) / slow.length, b = slow.reduce((s, o) => s + o.last, 0) / slow.length, falling = b < a * 0.93;

    else { r.tag = 'coaching'; r.text = 'Slow only for ' + names + ', who are ' + lv + '. Their times are flat after ' + nb(Math.min(...slow.map(o => o.n)), 'cycles') + ' (' + sec(b) + stdTxt + '). A short coaching session would help.'; }

const stepRows = (D, st, idx) => D.cycles.filter(c => c.st === st.id).map(c => ({ op: c.op, n: c.n, sh: c.sh, shift: SHIFTS[c.sh].label, sec: c.subs[idx] }));

// The three section models. Each one carries the headline, a status and its single big number.

    train.num = onPace; train.of = steps.length; train.tone = attn.some(a => a.dx.tag === 'process') ? 'crit' : attn.length ? 'warn' : 'good';

  let buckets;
  if (D.shifts.length > 1) buckets = D.shifts.map(s => ({ label: s.label.replace(' 08:00', ' am').replace(' 14:00', ' pm'), v: s.uph }));
  else buckets = [0, 1, 2, 3, 4, 5].map(i => ({ label: nb(i * 10, 'min'), v: D.shifts[0].tenMin[i] }));
  const thr = { stt, hot, units, uph, takt, buckets, cycles: D.cycles, over: hot && hot.med > takt };

    ? (thr.over ? nb(Math.round(uph), 'units/h') + ' (target ' + Math.round(3600 / takt) + ')' + '. ' + hot.st.short + ' sets the pace (' + sec(hot.med) + ' per unit vs ' + nb(takt, 's') + ' takt).' : nb(Math.round(uph), 'units/h') + ' (target ' + Math.round(3600 / takt) + ')' + '. Every station is within the ' + nb(takt, 's') + ' takt.')
    : hot.st.short + ' runs ' + sec(hot.med) + ' per unit' + (thr.over ? ', over the ' + nb(takt, 's') + ' takt.' : ', within the ' + nb(takt, 's') + ' takt.');

  const byReason = D.config.failReasons.map(r => ({ r, n: fails.filter(u => u.fail === r.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const mk = {}; D.cycles.filter(c => c.mistake).forEach(c => { const k = c.mistake.step + '|' + c.mistake.kind; mk[k] = (mk[k] || 0) + 1; });
  const mistakes = Object.keys(mk).map(k => { const [step, kind] = k.split('|'); return { step, kind, n: mk[k], sub: SUB(step) }; }).sort((a, b) => b.n - a.n);
  const mism = D.units.filter(u => u.mismatch);
  const cam = ['v1', 'v2'].map(m => { const cs = D.cycles.filter(c => c.model === m), rv = cs.filter(c => c.review); return { m, n: cs.length, need: cs.length ? cs.filter(c => c.needed).length / cs.length : 0, agree: rv.length ? rv.filter(c => c.review === 'agree').length / rv.length : 0, reviewed: rv.length }; }).filter(x => x.n);
  const qual = { fpy, units: D.units.length, fails, defects, byReason, mistakes, mism, cam, reasonOf };
  const topR = byReason[0];
  qual.headline = !D.units.length ? 'No units in this period.' : fpy >= 0.9 ? 'Quality is steady: ' + pct(fpy) + '% of units passed first time.'
    : pct(fpy) + '% of units passed first time.' + (topR ? ' Most fails: ' + topR.r.label.replace(/ \(.*\)/, '') + (topR.r.cause ? ' (' + STN(topR.r.cause).short + ').' : '.') : '');

  return { train, thr, qual };
}

function curve(series, std) {
  const W = 320, H = 124, L = 30, R = 38, T = 10, B = 22;
  let xm = 1, ym = std * 2; series.forEach(s => s.pts.forEach(p => { xm = Math.max(xm, p[0]); ym = Math.max(ym, p[1] * 1.08); }));
  const X = n => L + n / xm * (W - L - R), Y = v => H - B - v / ym * (H - T - B), cols = ['var(--c1)', 'var(--c2)', 'var(--c3)'];
  // end labels: sort by height and push apart so two labels never sit within 12 units of each other
  const lab = series.map((s, i) => ({ s, i, y: Y(s.pts[s.pts.length - 1][1]) + 3 })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < lab.length; k++) if (lab[k].y - lab[k - 1].y < 12) lab[k].y = lab[k - 1].y + 12;
  return '<svg class="curve" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Learning curve: seconds per cycle against cycle number, with the standard as a dashed line"><path class="ax" d="M' + L + ' ' + T + 'V' + (H - B) + 'H' + (W - R) + '"/>' +
    '<line class="std" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(std) + '" y2="' + Y(std) + '"/><text x="' + (L + 3) + '" y="' + (Y(std) - 4) + '">standard ' + sec(std) + '</text>' +
    '<text x="' + (L - 4) + '" y="' + (H - B + 3) + '" text-anchor="end">0</text><text x="' + (L - 4) + '" y="' + (T + 6) + '" text-anchor="end">' + nb(Math.round(ym), 's') + '</text><text x="' + L + '" y="' + (H - 6) + '">cycle number (0 to ' + xm + ')</text>' +
    series.map((s, i) => '<path class="ln" stroke="' + cols[i % 3] + '" d="' + s.pts.map((p, j) => (j ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('') + '"/>').join('') +
    lab.map(l => '<text x="' + (X(l.s.pts[l.s.pts.length - 1][0]) + 4) + '" y="' + l.y.toFixed(1) + '" style="fill:' + cols[l.i % 3] + '">' + l.s.op + '</text>').join('') + '</svg>';
}
function rolling(rows, w) { const a = rows.slice().sort((x, y) => x.n - y.n), out = []; for (let i = 0; i < a.length; i++) { const win = a.slice(Math.max(0, i - w + 1), i + 1).map(r => r.sec); out.push([a[i].n, med(win)]); } return out; }

const VIEWS = { today: vToday, training: vTraining, throughput: vThroughput, quality: vQuality, inbox: vInbox, rules: vRules };

/* ============ Render and events ============ */
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function stopPlay() { clearInterval(playTimer); playTimer = null; S.items.forEach(i => { i.playing = false; }); }
function render() {
  stopPlay(); D = loadDash({ period: S.period, station: S.station }); M = buildModels(D, S);
  document.querySelectorAll('[data-period]').forEach(b => b.setAttribute('aria-pressed', b.dataset.period === S.period));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));

  const cs = document.getElementById('code'); if (!cs.options.length || cs.dataset.v !== JSON.stringify(D.operators.map(o => o.code + o.level))) { cs.innerHTML = D.operators.map(o => '<option' + (o.code === S.code ? ' selected' : '') + '>' + o.code + '</option>').join(''); cs.dataset.v = JSON.stringify(D.operators.map(o => o.code + o.level)); }
  cs.value = S.code;
  document.getElementById('tabs').innerHTML = TABS.map(t => '<a href="#' + t[0] + '"' + (t[0] === S.tab ? ' aria-current="page"' : '') + '>' + t[1] + (t[0] === 'inbox' ? ' <span class="badge" aria-label="' + pending().length + ' waiting">' + pending().length + '</span>' : '') + '</a>').join('');
  document.getElementById('main').innerHTML = VIEWS[S.tab]();
  document.getElementById('foot').textContent = 'Sample data: made up for this mockup (one week, six sessions, four stations).' + (S.period === 'month' ? ' Month shows the same week until real sessions are connected.' : '');
}
function decide(i, outcome, extra) { i.status = 'done'; i.outcome = outcome; if (extra) extra(); render(); }
function setPos(i, p) { i.pos = Math.max(0, Math.min(1, p)); const ph = document.getElementById('ph'), tm = document.getElementById('tm'); if (ph) ph.style.left = (i.pos * 100).toFixed(1) + '%'; if (tm) tm.textContent = sec(i.pos * i.total); }
const cur = () => pending()[S.cur];
const A = {
  csv(t) { const c = CSVS[t.dataset.key]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c.text], { type: 'text/csv' })); a.download = c.file; document.body.appendChild(a); a.click(); a.remove(); toast('CSV ready: ' + c.n + ' rows'); },
  copycsv(t) { const c = CSVS[t.dataset.key]; (navigator.clipboard ? navigator.clipboard.writeText(c.text) : Promise.reject()).then(() => toast('CSV copied: ' + c.n + ' rows'), () => toast('Copy is blocked here. Use Download CSV.')); },
  confirm(t) { SKILL[t.dataset.code][t.dataset.st] = 'certified'; toast(t.dataset.code + ' is now certified on ' + t.dataset.st.toUpperCase()); render(); },
  item(t) { const i = S.items.find(x => x.id === t.dataset.id); if (i.status !== 'pending') return; S.list = false; S.cur = pending().indexOf(i); if (S.tab !== 'inbox') location.hash = '#inbox'; else render(); },
  list() { S.list = !S.list; render(); }, prev() { S.cur--; render(); }, next() { S.cur++; render(); },
  skip() { if (pending().length > 1) { S.cur++; toast('Skipped. It stays in the queue.'); } else toast('That was the last one.'); render(); },
  correct() { const i = cur(); if (i && i.kind === 'photo') decide(i, 'Correct', () => { S.kept++; toast('Marked correct. The photo is kept for training.'); }); },
  wrong() { const i = cur(); if (i && i.kind === 'photo') { i.wrongOpen = true; render(); document.getElementById('wrongPick').focus(); } },
  savewrong() { const i = cur(); i.pick = document.getElementById('wrongPick').value; decide(i, 'Corrected', () => { S.kept++; toast('Saved: ' + stepName(i.pick) + '. The photo is kept for training.'); }); },
  cant() { const i = cur(); decide(i, 'Can\'t tell', () => toast('Marked can\'t tell. The photo is deleted.')); },
  chip(t) { const i = cur(); i.reasons.has(t.dataset.r) ? i.reasons.delete(t.dataset.r) : i.reasons.add(t.dataset.r); render(); },
  savetags() { const i = cur(); if (!i.reasons.size) return toast('Pick at least one reason first.'); decide(i, [...i.reasons].join(', '), () => { S.mb = Math.max(0, S.mb - 18); toast('Tags saved. The clip is deleted.'); }); },
  accept() { const i = cur(), r = i.rule; S.rules.push({ id: 'r' + (S.rules.length + 1), kind: 'trial', on: true, status: '(collecting data)', p: { date: '2026-10-23', change: r.change, station: r.station, step: r.step } }); decide(i, 'Accepted', () => toast('Accepted. A trial was added to Rules.')); },
  dismiss() { const i = cur(); i.dismissOpen = true; render(); },

  play(t) { const i = S.items.find(x => x.id === t.dataset.id); if (i.playing) { stopPlay(); render(); return; } i.playing = true; if (i.pos >= 1) i.pos = 0; render(); i.playing = true; playTimer = setInterval(() => { setPos(i, i.pos + 0.3 / i.total); if (i.pos >= 1) { stopPlay(); render(); } }, 100); },
  seek(t, e) { const i = S.items.find(x => x.id === t.dataset.id), r = t.getBoundingClientRect(); setPos(i, (e.clientX - r.left) / r.width); },
  sw(t) { const r = S.rules.find(x => x.id === t.dataset.id); r.on = !r.on; render(); },
  nrkind(t) { S.nr.kind = t.dataset.k; render(); },
  addrule() { const n = S.nr, p = Object.assign({}, n[n.kind]); S.rules.push({ id: 'r' + (S.rules.length + 1), kind: n.kind, on: true, p, status: n.kind === 'trial' ? '(collecting data)' : '' }); toast('Rule added'); render(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-period],[data-view],[data-goto],[data-act]'); if (!t) return;
  if (t.dataset.period) { S.period = t.dataset.period; render(); }
  else if (t.dataset.view) { S.view = t.dataset.view; render(); }
  else if (t.dataset.goto) { location.hash = '#' + t.dataset.goto; }
  else if (A[t.dataset.act]) A[t.dataset.act](t, e);
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.k) d.open ? S.open.add(d.dataset.k) : S.open.delete(d.dataset.k); }, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'station') { S.station = t.value; render(); }
  else if (t.id === 'code') { S.code = t.value; render(); }
  else if (t.dataset.nr) { const [a, b] = t.dataset.nr.split('.'); S.nr[a][b] = t.type === 'number' ? Math.max(1, +t.value || 1) : t.value; }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.note) S.items.find(x => x.id === t.dataset.note).note = t.value; else if (t.dataset.nr && t.type === 'text') { const [a, b] = t.dataset.nr.split('.'); S.nr[a][b] = t.value; } });
document.addEventListener('keydown', e => {
  if (e.target.getAttribute && e.target.getAttribute('role') === 'slider' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const i = cur(); setPos(i, i.pos + (e.key === 'ArrowRight' ? 0.05 : -0.05)); return; }
  if (S.tab !== 'inbox' || S.list || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || !cur()) return;
  const k = e.key.toLowerCase(), i = cur();
  if (k === 's') A.skip();
  else if (k === 'y') { i.kind === 'photo' ? A.correct() : i.kind === 'slow' ? A.savetags() : i.dismissOpen ? 0 : A.accept(); }
  else if (k === 'n') { i.kind === 'photo' ? A.wrong() : i.kind === 'suggestion' ? A.dismiss() : 0; }
});
function route() { const h = location.hash.replace(/^#\/?/, ''); S.tab = VIEWS[h] ? h : 'today'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
seed(); route();
</script>
